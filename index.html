<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وەرگێڕی ژیر</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #f0f7fa; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background-color: white; width: 100%; max-width: 400px; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 20px; box-sizing: border-box; }
        h1 { text-align: center; color: #1e6091; font-size: 24px; margin-bottom: 20px; }
        
        /* شێوازی تابی بەشەکان */
        .tabs { display: flex; background-color: #e0f2fe; border-radius: 30px; padding: 5px; margin-bottom: 20px; }
        .tab-btn { flex: 1; background: none; border: none; padding: 10px; font-family: inherit; font-size: 15px; font-weight: bold; color: #1e6091; cursor: pointer; border-radius: 25px; transition: 0.3s; }
        .tab-btn.active { background-color: #1e6091; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* شێوازی بۆکسەکان */
        .box { border: 2px dashed #7dd3fc; border-radius: 20px; padding: 30px 20px; text-align: center; margin-bottom: 15px; background-color: #fafdfc; position: relative; }
        .box input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        textarea { width: 100%; box-sizing: border-box; border: 1px solid #bae6fd; border-radius: 15px; padding: 15px; font-family: inherit; font-size: 15px; min-height: 120px; resize: vertical; margin-bottom: 15px; }
        
        /* دوگمەی سەرەکی */
        .main-btn { width: 100%; background-color: #1e6091; color: white; border: none; padding: 15px; font-family: inherit; font-size: 16px; font-weight: bold; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 10px rgba(30,96,145,0.3); }
        .main-btn:disabled { background-color: #93c5fd; cursor: not-allowed; }
        
        .arrow { text-align: center; color: #1e6091; font-size: 24px; margin: -5px 0 10px 0; }
        .result-text { border: 1px solid #bae6fd; background-color: #f0f7fa; padding: 15px; border-radius: 15px; min-height: 100px; text-align: right; margin-top: 15px; white-space: pre-wrap; display: none;}
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 وەرگێڕی ژیر</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('image-tab', this)">📷 وێنە</button>
        <button class="tab-btn" onclick="showTab('file-tab', this)">📄 فایل</button>
        <button class="tab-btn" onclick="showTab('text-tab', this)">✏️ نووسین</button>
    </div>

    <!-- بەشی وێنە -->
    <div id="image-tab" class="tab-content active">
        <div class="box">
            <span style="font-size: 30px;">📤</span><br><br>
            <span id="img-name">وێنەکە لێرە دابنێ یان هەڵیبژێرە</span>
            <input type="file" id="image-input" accept="image/*" onchange="document.getElementById('img-name').innerText = this.files[0].name">
        </div>
        <button class="main-btn" id="img-btn" onclick="translateImage()">وێنەی وەرگێڕدراو بۆ کوردی</button>
        <div class="result-text" id="img-result"></div>
    </div>

    <!-- بەشی فایل -->
    <div id="file-tab" class="tab-content">
        <div class="box">
            <span style="font-size: 30px;">📄</span><br><br>
            <span id="file-name">ئەو فایلەی دیاری کراوە (.txt)</span>
            <input type="file" id="file-input" accept=".txt" onchange="document.getElementById('file-name').innerText = this.files[0].name">
        </div>
        <div class="arrow">↓</div>
        <button class="main-btn" id="file-btn" onclick="translateFile()">داگرتنی فایلی وەرگێڕدراو</button>
        <div class="result-text" id="file-result"></div>
    </div>

    <!-- بەشی نووسین -->
    <div id="text-tab" class="tab-content">
        <textarea id="text-input" placeholder="Write English text here..."></textarea>
        <div class="arrow">↓</div>
        <textarea id="text-output" placeholder="دەقی کوردی لێرە دەردەکەوێت" readonly></textarea>
        <button class="main-btn" id="text-btn" onclick="translateText()">وەرگێڕان بۆ کوردی</button>
    </div>
</div>

<script>
    // === کلیلەکەت لێرە دابنێ لەنێوان دوو کەوانەکە ===
    const API_KEY = "AQ.Ab8RN6IJ-evaYBvfXlJbzCR9aHDOxLyekxqgXnb6N4qyUZtxvw";
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    function showTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');
    }

    async function callGemini(prompt, base64Image = null, mimeType = null) {
        let contents = [{ parts: [{ text: prompt }] }];
        
        if (base64Image) {
            contents[0].parts.push({ inline_data: { mime_type: mimeType, data: base64Image.split(',')[1] } });
        }

        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: contents })
        });
        
        const data = await response.json();
        if(data.error) throw new Error(data.error.message);
        return data.candidates[0].content.parts[0].text;
    }

    // وەرگێڕانی نووسین
    async function translateText() {
        const text = document.getElementById("text-input").value;
        const btn = document.getElementById("text-btn");
        const output = document.getElementById("text-output");
        
        if (!text.trim()) return;
        btn.innerText = "خەریکی وەرگێڕانە..."; btn.disabled = true;
        
        try {
            output.value = await callGemini(`Translate this to Sorani Kurdish. Only return the translation:\n\n${text}`);
        } catch (e) { output.value = "هەڵەیەک ڕوویدا لە کاتی وەرگێڕان."; }
        
        btn.innerText = "وەرگێڕان بۆ کوردی"; btn.disabled = false;
    }

    // وەرگێڕانی وێنە
    async function translateImage() {
        const fileInput = document.getElementById('image-input');
        const btn = document.getElementById('img-btn');
        const output = document.getElementById('img-result');
        
        if (!fileInput.files[0]) { alert("تکایە سەرەتا وێنەیەک هەڵبژێرە"); return; }
        
        btn.innerText = "خەریکی خوێندنەوە و وەرگێڕانە..."; btn.disabled = true;
        output.style.display = "block"; output.innerText = "...";

        const reader = new FileReader();
        reader.onload = async function() {
            try {
                const prompt = "Extract all text from this image and translate it to Sorani Kurdish. Only return the translation.";
                output.innerText = await callGemini(prompt, reader.result, fileInput.files[0].type);
            } catch (e) { output.innerText = "هەڵەیەک ڕوویدا. دڵنیابە کلیلەکەت ڕاستە."; }
            btn.innerText = "وێنەی وەرگێڕدراو بۆ کوردی"; btn.disabled = false;
        };
        reader.readAsDataURL(fileInput.files[0]);
    }

    // وەرگێڕانی فایل
    async function translateFile() {
        const fileInput = document.getElementById('file-input');
        const btn = document.getElementById('file-btn');
        const output = document.getElementById('file-result');
        
        if (!fileInput.files[0]) { alert("تکایە فایلی .txt هەڵبژێرە"); return; }
        
        btn.innerText = "خەریکی وەرگێڕانە..."; btn.disabled = true;
        output.style.display = "block"; output.innerText = "...";

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const content = e.target.result;
                const translated = await callGemini(`Translate this file content to Sorani Kurdish:\n\n${content}`);
                
                output.innerText = "وەرگێڕانەکە تەواو بوو. فایلەکە دادەبەزێت...";
                
                // دروستکردنی فایلی نوێ بۆ داگرتن
                const blob = new Blob([translated], { type: "text/plain;charset=utf-8" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "Kurdish_" + fileInput.files[0].name;
                link.click();
            } catch (err) { output.innerText = "هەڵەیەک ڕوویدا."; }
            btn.innerText = "داگرتنی فایلی وەرگێڕدراو"; btn.disabled = false;
        };
        reader.readAsText(fileInput.files[0]);
    }
</script>
</body>
</html>
