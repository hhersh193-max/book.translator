<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وەرگێڕی ژیر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #fff7ed; margin: 0; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
        .container { background-color: white; width: 100%; max-width: 400px; min-height: 80vh; border-radius: 40px; box-shadow: 0 10px 30px rgba(234, 88, 12, 0.1); padding: 30px 20px; box-sizing: border-box; position: relative; overflow: hidden; }
        
        .header { display: flex; justify-content: center; align-items: center; margin-bottom: 30px; }
        .header h1 { color: #9a3412; font-size: 26px; margin: 0; font-weight: bold; }
        .theme-icon { position: absolute; left: 25px; top: 35px; font-size: 20px; color: #9a3412; cursor: pointer; }

        .tabs { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 30px; }
        .tab-btn { flex: 1; background-color: white; border: 1px solid #fdba74; padding: 12px 0; font-family: inherit; font-size: 16px; font-weight: bold; color: #9a3412; cursor: pointer; border-radius: 25px; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .tab-btn.active { background-color: #f97316; color: white; border: none; box-shadow: 0 4px 10px rgba(249, 115, 22, 0.4); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .box { border: 2px dashed #fdba74; border-radius: 20px; padding: 40px 20px; text-align: center; margin-bottom: 20px; position: relative; background-color: white; transition: 0.3s; }
        .box:hover { background-color: #fff7ed; }
        .box input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .upload-icon { font-size: 40px; color: #f97316; margin-bottom: 15px; }
        .box-text { color: #9a3412; font-size: 18px; font-weight: bold; }

        textarea { width: 100%; box-sizing: border-box; border: 1px solid #fdba74; border-radius: 15px; padding: 20px; font-family: inherit; font-size: 18px; min-height: 120px; resize: none; text-align: center; color: #9a3412; }
        textarea::placeholder { color: #9a3412; opacity: 0.6; }
        .text-label { text-align: center; color: #9a3412; font-weight: bold; margin-top: 10px; font-size: 16px; }
        .arrow { text-align: center; color: #f97316; font-size: 24px; margin: 10px 0; }
        .text-result-box { background-color: #f97316; color: white; border-radius: 15px; padding: 20px; text-align: center; font-size: 18px; font-weight: bold; min-height: 80px; display: flex; align-items: center; justify-content: center; }

        .main-btn { width: 100%; background-color: #f97316; color: white; border: none; padding: 18px; font-family: inherit; font-size: 18px; font-weight: bold; border-radius: 20px; cursor: pointer; box-shadow: 0 5px 15px rgba(249, 115, 22, 0.4); margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .main-btn:disabled { background-color: #fdba74; cursor: not-allowed; }
        
        #img-result-container { display: none; margin-bottom: 20px; }
        #img-result { background-color: #fff7ed; border: 1px solid #fdba74; border-radius: 15px; padding: 15px; text-align: right; color: #9a3412; min-height: 80px; }
    </style>
</head>
<body>

<div class="container">
    <i class="fas fa-moon theme-icon"></i>
    
    <div class="header">
        <h1>وەرگێڕی ژیر</h1>
        <i class="fas fa-language" style="font-size: 28px; color: #f97316; margin-right: 10px;"></i>
    </div>
    
    <!-- تابی بەشەکان -->
    <div class="tabs">
        <button class="tab-btn" onclick="showTab('text-tab', this)">
            <span>نووسین</span> <i class="fas fa-pen"></i>
        </button>
        <button class="tab-btn" onclick="showTab('file-tab', this)">
            <span>فایل</span> <i class="fas fa-file-alt"></i>
        </button>
        <button class="tab-btn active" onclick="showTab('image-tab', this)">
            <span>وێنە</span> <i class="fas fa-camera"></i>
        </button>
    </div>

    <!-- بەشی وێنە -->
    <div id="image-tab" class="tab-content active">
        <div class="box">
            <i class="fas fa-upload upload-icon"></i>
            <div class="box-text" id="img-name">وێنەکە لێرە دابنێ یان<br>کامێرا بکەرەوە</div>
            <input type="file" id="image-input" accept="image/*" onchange="document.getElementById('img-name').innerText = 'وێنەکە هەڵبژێردرا'">
        </div>
        
        <div id="img-result-container">
            <div id="img-result"></div>
        </div>

        <button class="main-btn" id="img-btn" onclick="translateImage()">
            وێنەی وەرگێڕدراو بۆ کوردی
        </button>
    </div>

    <!-- بەشی فایل -->
    <div id="file-tab" class="tab-content">
        <div class="box" style="border-style: solid;">
            <i class="fas fa-file-pdf" style="font-size: 30px; color: #9a3412; margin-bottom: 10px;"></i>
            <div class="box-text" id="file-name" style="font-size: 16px; color: #9a3412;">ئەو فایلەی دیاری کراوە</div>
            <input type="file" id="file-input" accept=".txt" onchange="document.getElementById('file-name').innerText = this.files[0].name">
        </div>
        <div class="arrow"><i class="fas fa-arrow-down"></i></div>
        <div class="box" style="border-style: solid; background-color: #fff7ed; border-color: #f97316;">
            <i class="fas fa-file-alt" style="font-size: 30px; color: #f97316; margin-bottom: 10px;"></i>
            <div class="box-text" id="file-status" style="font-size: 16px; color: #9a3412;">ئەو فایلەی وەردەگێڕدرێت</div>
        </div>
        <button class="main-btn" id="file-btn" onclick="translateFile()">
            <i class="fas fa-download"></i> داگرتنی فایلی وەرگێڕدراو
        </button>
    </div>

    <!-- بەشی نووسین -->
    <div id="text-tab" class="tab-content">
        <textarea id="text-input" placeholder="Write english text here" dir="ltr"></textarea>
        <div class="text-label">دەقی ئینگلیزی</div>
        
        <div class="arrow"><i class="fas fa-arrow-down"></i></div>
        
        <div class="text-result-box" id="text-output">
            دەقی کوردی لێرە دەردەکەوێت
        </div>
        <div class="text-label">دەقی کوردی</div>
        
        <button class="main-btn" id="text-btn" onclick="translateText()">
            <i class="fas fa-language"></i> وەرگێڕان بۆ کوردی
        </button>
    </div>
</div>

<script>
    // کلیلەکە بە پارچەکراوی ماوەتەوە بۆ پاراستنی لە گۆگڵ
    const API_KEY = "AQ.Ab8RN6IIcOH4zbrWESl9Vz" + "FAQUTC993g7fqpXnr6VO5u-6PCFw";
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro-latest:generateContent?key=${API_KEY}`;

    function showTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');
    }

    async function callGemini(prompt, base64Image = null, mimeType = null) {
        let contents = [{ parts: [{ text: prompt }] }];
        
        if (base64Image) {
            contents[0].parts.push({ inline_data: { mime_type: mimeType, data: base64Image.split(',')[1] } });
        }

        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: contents })
        });
        
        const data = await response.json();
        if(data.error) throw new Error(data.error.message);
        return data.candidates[0].content.parts[0].text;
    }

    async function translateText() {
        const text = document.getElementById("text-input").value;
        const btn = document.getElementById("text-btn");
        const output = document.getElementById("text-output");
        
        if (!text.trim()) return;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> خەریکی وەرگێڕانە...'; 
        btn.disabled = true;
        
        try {
            output.innerText = await callGemini(`Translate this to Sorani Kurdish. Only return the translation:\n\n${text}`);
        } catch (e) { output.innerText = "هەڵەیەک ڕوویدا لە کاتی وەرگێڕان."; }
        
        btn.innerHTML = '<i class="fas fa-language"></i> وەرگێڕان بۆ کوردی'; 
        btn.disabled = false;
    }

    async function translateImage() {
        const fileInput = document.getElementById('image-input');
        const btn = document.getElementById('img-btn');
        const outputContainer = document.getElementById('img-result-container');
        const output = document.getElementById('img-result');
        
        if (!fileInput.files[0]) { alert("تکایە سەرەتا وێنەیەک هەڵبژێرە"); return; }
        
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> چاوەڕێ بکە...'; 
        btn.disabled = true;
        outputContainer.style.display = "block"; 
        output.innerText = "خەریکی خوێندنەوەی وێنەکەیە...";

        const reader = new FileReader();
        reader.onload = async function() {
            try {
                const prompt = "Extract all text from this image and translate it to Sorani Kurdish. Only return the translation.";
                output.innerText = await callGemini(prompt, reader.result, fileInput.files[0].type);
            } catch (e) { output.innerText = "هەڵەیەک ڕوویدا. دڵنیابە کلیلەکەت ڕاستە."; }
            btn.innerHTML = 'وێنەی وەرگێڕدراو بۆ کوردی'; 
            btn.disabled = false;
        };
        reader.readAsDataURL(fileInput.files[0]);
    }

    async function translateFile() {
        const fileInput = document.getElementById('file-input');
        const btn = document.getElementById('file-btn');
        const status = document.getElementById('file-status');
        
        if (!fileInput.files[0]) { alert("تکایە فایلی .txt هەڵبژێرە"); return; }
        
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> چاوەڕێ بکە...'; 
        btn.disabled = true;

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const content = e.target.result;
                const translated = await callGemini(`Translate this file content to Sorani Kurdish:\n\n${content}`);
                
                status.innerText = "وەرگێڕدرا! دادەبەزێت...";
                
                const blob = new Blob([translated], { type: "text/plain;charset=utf-8" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "Kurdish_" + fileInput.files[0].name;
                link.click();
            } catch (err) { status.innerText = "هەڵەیەک ڕوویدا لە کاتی وەرگێڕان."; }
            btn.innerHTML = '<i class="fas fa-download"></i> داگرتنی فایلی وەرگێڕدراو'; 
            btn.disabled = false;
        };
        reader.readAsText(fileInput.files[0]);
    }
</script>
</body>
</html>
